<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫姬桌面宠物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #f5f5f5;
        }

        #pet-container {
            position: fixed;
            cursor: move;
            z-index: 9999;
            user-select: none;
        }

        #pet-canvas {
            display: block;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
        }

        #control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 10000;
            max-width: 300px;
        }

        #control-panel h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-group select {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        button {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            margin: 5px 5px 5px 0;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .info {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .info p {
            margin: 3px 0;
        }

        .toggle-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10001;
        }

        #hide-panel-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        #hide-panel-btn:hover {
            background: #764ba2;
        }

        .hidden {
            display: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 10px;
        }

        .action-buttons button {
            margin: 0;
            font-size: 11px;
            padding: 6px 10px;
        }
    </style>
</head>
<body>
    <!-- 宠物容器 -->
    <div id="pet-container">
        <canvas id="pet-canvas"></canvas>
    </div>

    <!-- 控制面板切换按钮 -->
    <div class="toggle-panel">
        <button id="hide-panel-btn" onclick="togglePanel()">隐藏控制面板</button>
    </div>

    <!-- 控制面板 -->
    <div id="control-panel">
        <h3>🐱 猫姬控制面板</h3>

        <div class="control-group">
            <label>宠物大小：<span id="scale-value">25%</span></label>
            <input type="range" id="scale-range" min="5" max="100" value="25" step="1">
        </div>

        <div class="control-group">
            <label>动画速度：<span id="fps-value">24 FPS</span></label>
            <input type="range" id="fps-range" min="10" max="60" value="24" step="2">
        </div>

        <div class="control-group">
            <label>自动行为频率：<span id="behavior-value">中等</span></label>
            <input type="range" id="behavior-range" min="1" max="5" value="3" step="1">
        </div>

        <div class="control-group">
            <label>手动播放动作：</label>
            <select id="manual-action">
                <option value="">选择动作...</option>
            </select>
            <button onclick="playManualAction()" style="width: 100%; margin-top: 5px;">播放选中动作</button>
        </div>

        <div class="action-buttons">
            <button onclick="pet.playAction('030')">点头</button>
            <button onclick="pet.playAction('290')">后空翻</button>
            <button onclick="pet.playAction('340')">大吼</button>
            <button onclick="pet.playAction('500')">跳舞</button>
            <button onclick="pet.playAction('507')">惊讶</button>
            <button onclick="pet.playAction('960')">兴奋</button>
            <button onclick="pet.playAction('806')">连击</button>
            <button onclick="pet.playAction('990')">侦探</button>
        </div>

        <div style="margin-top: 15px;">
            <button onclick="pet.toggleAutoBehavior()">开关自动行为</button>
            <button onclick="pet.resetPosition()">重置位置</button>
        </div>

        <div class="info">
            <p><strong>当前状态：</strong><span id="current-state">待机</span></p>
            <p><strong>当前动作：</strong><span id="current-action">000</span></p>
            <p><strong>位置：</strong><span id="position">-</span></p>
        </div>

        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; font-size: 11px; color: #999;">
            <p>💡 提示：</p>
            <p>• 拖动猫姬移动位置</p>
            <p>• 点击猫姬触发随机动作</p>
            <p>• 双击猫姬进入兴奋状态</p>
        </div>
    </div>

    <script src="images_list.js"></script>
    <script src="pet-engine.js"></script>
    <script>
        // 初始化宠物
        let pet = null;

        window.addEventListener('load', async () => {
            pet = new NecoaPet('pet-container', 'pet-canvas');
            await pet.init();

            // 绑定控制器
            setupControls();
        });

        function setupControls() {
            const scaleRange = document.getElementById('scale-range');
            const scaleValue = document.getElementById('scale-value');
            const fpsRange = document.getElementById('fps-range');
            const fpsValue = document.getElementById('fps-value');
            const behaviorRange = document.getElementById('behavior-range');
            const behaviorValue = document.getElementById('behavior-value');
            const manualAction = document.getElementById('manual-action');

            // 填充手动动作选择框
            Object.keys(pet.animations).forEach(actionId => {
                const option = document.createElement('option');
                option.value = actionId;
                option.textContent = `${actionId} - ${pet.getActionName(actionId)}`;
                manualAction.appendChild(option);
            });

            // 缩放控制
            scaleRange.addEventListener('input', () => {
                const scale = scaleRange.value;
                scaleValue.textContent = scale + '%';
                pet.setScale(scale / 100);
            });

            // FPS控制
            fpsRange.addEventListener('input', () => {
                const fps = fpsRange.value;
                fpsValue.textContent = fps + ' FPS';
                pet.setFPS(fps);
            });

            // 行为频率控制
            behaviorRange.addEventListener('input', () => {
                const level = parseInt(behaviorRange.value);
                const labels = ['很低', '低', '中等', '高', '很高'];
                behaviorValue.textContent = labels[level - 1];
                pet.setBehaviorFrequency(level);
            });
        }

        function playManualAction() {
            const actionId = document.getElementById('manual-action').value;
            if (actionId) {
                pet.playAction(actionId);
            } else {
                alert('请先选择一个动作！');
            }
        }

        function togglePanel() {
            const panel = document.getElementById('control-panel');
            const btn = document.getElementById('hide-panel-btn');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                btn.textContent = '隐藏控制面板';
            } else {
                panel.classList.add('hidden');
                btn.textContent = '显示控制面板';
            }
        }
    </script>
</body>
</html>
