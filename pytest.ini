[pytest]
testpaths = tests
# tests/legacy_backend/ 是从另一个项目（微信陪伴 Agent 的 backend 包）拷来的测试，
# 与本仓库 agent_core 架构无关，收集阶段会因缺少 backend 模块报错。
# 归档保留作参考，不参与本仓库测试收集。
norecursedirs = legacy_backend .tox venv .venv *.egg .* CVS _darcs {arch}
asyncio_mode = auto
markers =
    matrix: 行为决策单元矩阵（套1-4，无 LLM 依赖，每 commit 跑）
    llm_eval: 需 API key 的 LLM 评估（套5-7，gated job 跑）
